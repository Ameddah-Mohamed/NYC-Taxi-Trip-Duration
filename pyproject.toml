[project]
name = "nyc-taxi-trip-duration-mle"
version = "0.1.0"
description = "End-to-end MLOps pipeline for NYC Taxi Trip Duration prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "optuna>=3.6.0",
    "mlflow>=2.14.0",
    "geopy>=2.4.0",
    "joblib>=1.6.0",
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "httpx2>=2.12.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
